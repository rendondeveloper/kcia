schema_version: 1
# Known MCP servers. Enable them per repository with `kcia mcp add <id>`.
#
# `roles` is the gating: which agents can see the server. It's actually enforced in
# Claude Code, which accepts `--mcp-config` per invocation; Cursor reads a
# global repo file, so there the declaration is informational (see README).
#
# kcia never stores credentials: the CLI of the provider opens the session.
servers:
  atlassian:
    display_name: "Atlassian (Jira + Confluence)"
    transport: sse
    url: "https://mcp.atlassian.com/v1/sse"
    cloud_only: true
    roles: [planner]
    description: "Read issues and pages to understand and plan the work."
    # Explicit allowlist: without it Claude denies every MCP call in
    # `--print` mode. Granting the whole server (`mcp__atlassian`) would include
    # createJiraIssue, editJiraIssue, addCommentToJiraIssue and transitionJiraIssue,
    # which the guardrails forbid. Listing read-only tools turns that policy
    # into a real restriction.
    allowed_tools:
      - mcp__atlassian__atlassianUserInfo
      - mcp__atlassian__getAccessibleAtlassianResources
      - mcp__atlassian__getVisibleJiraProjects
      - mcp__atlassian__getJiraIssue
      - mcp__atlassian__getJiraIssueRemoteIssueLinks
      - mcp__atlassian__getJiraProjectIssueTypesMetadata
      - mcp__atlassian__getTransitionsForJiraIssue
      - mcp__atlassian__searchJiraIssuesUsingJql
      - mcp__atlassian__lookupJiraAccountId
      - mcp__atlassian__search
      - mcp__atlassian__fetch
      - mcp__atlassian__getConfluencePage
      - mcp__atlassian__getConfluenceSpaces
      - mcp__atlassian__getPagesInConfluenceSpace
      - mcp__atlassian__getConfluencePageFooterComments
      - mcp__atlassian__searchConfluenceUsingCql
    auth_hint: >-
      Browser OAuth. Claude Code: `claude mcp add --transport sse atlassian
      https://mcp.atlassian.com/v1/sse` and follow the login. Cursor: `cursor-agent mcp
      login atlassian`. Requires Atlassian Cloud; Server/Data Center is not supported.
    verify_hint: >-
      Confirm the current URL in Atlassian's documentation before relying on
      it: the remote server is still evolving and the path has changed before.

  github:
    display_name: "GitHub"
    transport: http
    url: "https://api.githubcopilot.com/mcp/"
    roles: [planner]
    description: "Read issues and pull requests."
    allowed_tools: [mcp__github]
    auth_hint: >-
      `claude mcp add --transport http github https://api.githubcopilot.com/mcp/`
      and complete the login. The guardrails keep opening and merging PRs disabled.

  sentry:
    display_name: "Sentry"
    transport: http
    url: "https://mcp.sentry.dev/mcp"
    roles: [planner, builder]
    description: "Look up production errors while diagnosing a bug."
    allowed_tools: [mcp__sentry]
    auth_hint: "`claude mcp add --transport http sentry https://mcp.sentry.dev/mcp`"
