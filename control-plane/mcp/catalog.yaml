schema_version: 1
# Known MCP servers. Enable them per repository with `kcia mcp add <id>`.
#
# `roles` is the gating: which agents can see the server. It's actually enforced in
# Claude Code, which accepts `--mcp-config` per invocation; Cursor reads a
# global repo file, so there the declaration is informational (see README).
#
# kcia never stores credentials: the CLI of the provider opens the session.
servers:
  atlassian:
    display_name: "Atlassian (Jira + Confluence)"
    transport: http
    # Flat tool exposure preserves per-tool allowlists; no generic execute grants.
    url: "https://mcp.atlassian.com/v2/mcp?tools=all"
    cloud_only: true
    roles: [planner]
    description: "Read issues and pages to understand and plan the work."
    # Explicit allowlist: without it Claude denies every MCP call in
    # `--print` mode. Granting the whole server (`mcp__atlassian`) would include
    # createJiraIssue, editJiraIssue, addCommentToJiraIssue and transitionJiraIssue,
    # which the guardrails forbid. Listing read-only tools turns that policy
    # into a real restriction.
    allowed_tools:
      - mcp__atlassian__atlassianUserInfo
      - mcp__atlassian__getAccessibleAtlassianResources
      - mcp__atlassian__listJiraProjects
      - mcp__atlassian__getJiraIssue
      - mcp__atlassian__listJiraIssueRemoteIssueLinks
      - mcp__atlassian__listJiraProjectIssueTypesMetadata
      - mcp__atlassian__listJiraIssueTransitions
      - mcp__atlassian__searchJiraIssuesUsingJql
      - mcp__atlassian__listJiraIssueComments
      - mcp__atlassian__lookupJiraAccountId
      - mcp__atlassian__getConfluenceContent
      - mcp__atlassian__listConfluenceSpaces
      - mcp__atlassian__listConfluenceContent
      - mcp__atlassian__listConfluenceComments
      - mcp__atlassian__searchConfluence
    auth_hint: >-
      From this project, register once: `claude mcp add --scope local --transport
      http atlassian 'https://mcp.atlassian.com/v2/mcp?tools=all'`. Then authenticate
      separately with `claude mcp login atlassian`, or open `claude` and use `/mcp`.
      An existing server does not prove OAuth is connected. After migrating from
      v1, authenticate again. Cursor: `cursor-agent mcp login atlassian`.
      Requires Atlassian Cloud; Server/Data Center is not supported.
    verify_hint: >-
      Run `claude mcp list` from this project and confirm Atlassian is connected.
      Both Claude and KCIA must use the same URL, including ?tools=all.
      Setup: https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/

  github:
    display_name: "GitHub"
    transport: http
    url: "https://api.githubcopilot.com/mcp/"
    roles: [planner]
    description: "Read issues and pull requests."
    allowed_tools: [mcp__github]
    auth_hint: >-
      `claude mcp add --transport http github https://api.githubcopilot.com/mcp/`
      and complete the login. The guardrails keep opening and merging PRs disabled.

  sentry:
    display_name: "Sentry"
    transport: http
    url: "https://mcp.sentry.dev/mcp"
    roles: [planner, builder]
    description: "Look up production errors while diagnosing a bug."
    allowed_tools: [mcp__sentry]
    auth_hint: "`claude mcp add --transport http sentry https://mcp.sentry.dev/mcp`"
