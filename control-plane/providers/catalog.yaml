schema_version: 1
providers:
  claude:
    display_name: "Claude Code"
    executable: claude
    install_hint: "npm i -g @anthropic-ai/claude-code  or  brew install --cask claude-code"
    auth: subscription
    auth_hint: "Run `claude` and complete the login."
    models:
      - { id: claude-opus-5, tier: max, best_for: [planning, complex-implementation] }
      - { id: claude-sonnet-5, tier: balanced, best_for: [implementation, review] }
      - { id: claude-haiku-4-5, tier: fast, best_for: [documentation, pr-preparation] }
    default_model: claude-sonnet-5
  cursor:
    display_name: "Cursor"
    executable: cursor-agent
    install_hint: "Install Cursor and enable the CLI from the command palette."
    auth: subscription
    auth_hint: "Sign in to Cursor."
    # Ids verified with `cursor-agent --list-models`. Cursor uses its own ids
    # (with an effort suffix), not the Anthropic API's: plain `claude-sonnet-5`
    # does NOT exist here. Curated list, not exhaustive.
    models:
      - { id: auto, tier: balanced, best_for: [general, cost-control] }
      - { id: composer-2.5, tier: fast, best_for: [implementation, refactor] }
      - { id: composer-2.5-fast, tier: fast, best_for: [documentation] }
      - { id: claude-opus-5-thinking-high, tier: max, best_for: [planning, complex-implementation] }
      - { id: claude-sonnet-5-thinking-high, tier: balanced, best_for: [implementation, review] }
      - { id: gpt-5.3-codex, tier: max, best_for: [implementation] }
      - { id: gemini-3.5-flash, tier: fast, best_for: [documentation] }
    default_model: auto
  opencode:
    display_name: "OpenCode"
    executable: opencode
    install_hint: "curl -fsSL https://opencode.ai/install | bash"
    auth: api-key
    auth_hint: "Run `opencode auth login` and confirm with `opencode auth list`."
    # Ids resolved with `opencode models --verbose` (OpenCode 1.18.21).
    # These are the Zen free-tier models; ids are `provider/model`.
    models:
      - { id: opencode/mimo-v2.5-free, tier: max, best_for: [planning, complex-implementation] }
      - { id: opencode/nemotron-3-ultra-free, tier: max, best_for: [planning, complex-implementation] }
      - { id: opencode/big-pickle, tier: balanced, best_for: [implementation, review] }
      - { id: opencode/hy3-free, tier: balanced, best_for: [implementation, review] }
      - { id: opencode/muse-spark-1.2-contributor-free, tier: balanced, best_for: [implementation, documentation] }
      - { id: opencode/nemotron-3.5-lightning-free, tier: fast, best_for: [documentation, pr-prep] }
      - { id: opencode/x-preview-f-free, tier: fast, best_for: [documentation] }
    default_model: opencode/big-pickle
