schema_version: 1
providers:
  claude:
    display_name: "Claude Code"
    executable: claude
    install_hint: "npm i -g @anthropic-ai/claude-code  or  brew install --cask claude-code"
    auth: subscription
    auth_hint: "Run `claude` and complete the login."
    models:
      - { id: claude-opus-5, tier: max, best_for: [planning, complex-implementation] }
      - { id: claude-sonnet-5, tier: balanced, best_for: [implementation, review] }
      - { id: claude-haiku-4-5, tier: fast, best_for: [documentation, pr-preparation] }
    default_model: claude-sonnet-5
  cursor:
    display_name: "Cursor"
    executable: cursor-agent
    install_hint: "Install Cursor and enable the CLI from the command palette."
    auth: subscription
    auth_hint: "Sign in to Cursor."
    # Ids verified with `cursor-agent --list-models`. Cursor uses its own ids
    # (with an effort suffix), not the Anthropic API's: plain `claude-sonnet-5`
    # does NOT exist here. Curated list, not exhaustive.
    models:
      - { id: auto, tier: balanced, best_for: [general, cost-control] }
      - { id: composer-2.5, tier: fast, best_for: [implementation, refactor] }
      - { id: composer-2.5-fast, tier: fast, best_for: [documentation] }
      - { id: claude-opus-5-thinking-high, tier: max, best_for: [planning, complex-implementation] }
      - { id: claude-sonnet-5-thinking-high, tier: balanced, best_for: [implementation, review] }
      - { id: gpt-5.3-codex, tier: max, best_for: [implementation] }
      - { id: gemini-3.5-flash, tier: fast, best_for: [documentation] }
    default_model: auto
  opencode:
    display_name: "OpenCode"
    executable: opencode
    install_hint: "curl -fsSL https://opencode.ai/install | bash"
    auth: api-key
    auth_hint: "Run `opencode auth login` and confirm with `opencode auth list`."
    # Ids reported by the authenticated `opencode models` command (OpenCode
    # 1.18.30). Model ids are `provider/model`; metadata is intentionally only
    # assigned where the account catalog has an established classification.
    models:
      - { id: opencode/big-pickle, tier: balanced, best_for: [implementation, review] }
      - { id: opencode/ling-3.0-flash-fin-free }
      - { id: opencode/mimo-v2.5-free, tier: max, best_for: [planning, complex-implementation] }
      - { id: opencode/muse-spark-1.2-contributor-free, tier: balanced, best_for: [implementation, documentation] }
      - { id: opencode/muse-spark-1.3-contributor-free, tier: balanced, best_for: [implementation, documentation] }
      - { id: opencode/nemotron-3-ultra-free, tier: max, best_for: [planning, complex-implementation] }
      - { id: opencode/nemotron-3.5-lightning-free, tier: fast, best_for: [documentation, pr-prep] }
      - { id: opencode-go/deepseek-v4-flash }
      - { id: opencode-go/deepseek-v4-flash-vision-exp }
      - { id: opencode-go/deepseek-v4-pro }
      - { id: opencode-go/glm-5.1 }
      - { id: opencode-go/glm-5.2 }
      - { id: opencode-go/glm-5.3 }
      - { id: opencode-go/glm-5.3-flash }
      - { id: opencode-go/gpt-5.6-luna }
      - { id: opencode-go/grok-4.6 }
      - { id: opencode-go/hy3 }
      - { id: opencode-go/hy4-preview }
      - { id: opencode-go/kimi-k2.6 }
      - { id: opencode-go/kimi-k2.7-code }
      - { id: opencode-go/kimi-k3 }
      - { id: opencode-go/longcat-2.0 }
      - { id: opencode-go/mimo-v2.5 }
      - { id: opencode-go/mimo-v2.5-pro }
      - { id: opencode-go/minimax-m2.7 }
      - { id: opencode-go/minimax-m3 }
      - { id: opencode-go/muse-spark-1.2-contributor }
      - { id: opencode-go/muse-spark-1.3-contributor }
      - { id: opencode-go/omen-alpha }
      - { id: opencode-go/qwen3.6-plus }
      - { id: opencode-go/qwen3.7-max }
      - { id: opencode-go/qwen3.7-plus }
      - { id: opencode-go/qwen3.8-flash }
      - { id: opencode-go/qwen3.8-max }
    default_model: opencode/big-pickle
  ollama:
    display_name: "Ollama (local)"
    executable: ollama
    install_hint: "brew install ollama  then  ollama serve"
    auth: none
    auth_hint: "No auth. Ensure the daemon is running (`ollama serve`) and OLLAMA_HOST points at it."
    model_source: live
    models:
      - { id: qwen3:14b, tier: balanced, best_for: [planning, analysis], num_ctx: 32768 }
      - { id: qwen2.5-coder:14b, tier: balanced, best_for: [implementation, refactor], num_ctx: 32768 }
      - { id: devstral-small-2:24b, tier: max, best_for: [implementation, refactor], num_ctx: 32768 }
    default_model: devstral-small-2:24b
