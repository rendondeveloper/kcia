[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kcia"
dynamic = ["version"]
description = "Control plane and CLI for development agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.4",
  "pydantic>=2.8.2",
  "httpx>=0.27.0",
  "keyring>=25.2.0",
  "pathspec>=0.12.1",
  "packaging>=24.0",
  "mcp[cli]>=1.27.0",
]

[project.scripts]
kcia = "kcia.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "kcia.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
